<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 30" width="160" height="30" fill="none">
  <!-- Original block-print vine border. Seamless horizontal tile. -->
  <g stroke="#7A1F2B" stroke-width="1.8" stroke-linecap="round">
    <path d="M0 15 C 22 2 58 2 80 15 C 102 28 138 28 160 15"/>
  </g>

  <g fill="#7A1F2B">
    <!-- lotus, crowning the first arch -->
    <g transform="translate(40,7.4)">
      <path d="M0 0 C -3.4 -1.6 -4.6 -4.6 -4.4 -7.4 C -1.8 -6.4 -0.4 -3.4 0 0 Z"/>
      <path d="M0 0 C 3.4 -1.6 4.6 -4.6 4.4 -7.4 C 1.8 -6.4 0.4 -3.4 0 0 Z"/>
      <path d="M0 .4 C -2.4 -2.2 -2.4 -5.6 0 -8.2 C 2.4 -5.6 2.4 -2.2 0 .4 Z"/>
    </g>
    <!-- lotus, hanging under the second arch -->
    <g transform="translate(120,22.6) scale(1,-1)">
      <path d="M0 0 C -3.4 -1.6 -4.6 -4.6 -4.4 -7.4 C -1.8 -6.4 -0.4 -3.4 0 0 Z"/>
      <path d="M0 0 C 3.4 -1.6 4.6 -4.6 4.4 -7.4 C 1.8 -6.4 0.4 -3.4 0 0 Z"/>
      <path d="M0 .4 C -2.4 -2.2 -2.4 -5.6 0 -8.2 C 2.4 -5.6 2.4 -2.2 0 .4 Z"/>
    </g>

    <!-- leaves riding the vine -->
    <path d="M17 11.4 C 14.6 8.6 15 5.6 18 4.4 C 19.6 7 19.4 9.8 17 11.4 Z"/>
    <path d="M63 11.4 C 65.4 8.6 65 5.6 62 4.4 C 60.4 7 60.6 9.8 63 11.4 Z"/>
    <path d="M97 18.6 C 94.6 21.4 95 24.4 98 25.6 C 99.6 23 99.4 20.2 97 18.6 Z"/>
    <path d="M143 18.6 C 145.4 21.4 145 24.4 142 25.6 C 140.4 23 140.6 20.2 143 18.6 Z"/>

    <!-- nodes where the vine crosses -->
    <circle cx="80" cy="15" r="2.4"/>
    <circle cx="0"   cy="15" r="2.4"/>
    <circle cx="160" cy="15" r="2.4"/>
  </g>
</svg>
