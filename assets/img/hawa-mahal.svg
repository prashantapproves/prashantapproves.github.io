<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 68" width="90" height="68" fill="none">
  <!-- Hawa Mahal jharokha facade, silhouette. Jaipur.
       Used as a faint backdrop, so it is drawn as flat fills.
       Seamless repeat-x: window centres on x = 15, 45, 75; tile edge falls mid-gap. -->

  <g fill="#7A1F2B">

    <!-- chhatri domes: wide and low, with a short finial -->
    <g>
      <path d="M5 20 C5 12 9.5 8.5 15 8.5 C20.5 8.5 25 12 25 20 Z"/>
      <rect x="14.3" y="4" width="1.4" height="5"/>
      <circle cx="15" cy="3.4" r="1.6"/>

      <path d="M35 20 C35 12 39.5 8.5 45 8.5 C50.5 8.5 55 12 55 20 Z"/>
      <rect x="44.3" y="4" width="1.4" height="5"/>
      <circle cx="45" cy="3.4" r="1.6"/>

      <path d="M65 20 C65 12 69.5 8.5 75 8.5 C80.5 8.5 85 12 85 20 Z"/>
      <rect x="74.3" y="4" width="1.4" height="5"/>
      <circle cx="75" cy="3.4" r="1.6"/>
    </g>

    <!-- cornice -->
    <rect x="-2" y="20" width="94" height="3.4"/>

    <!-- jharokha windows: pointed arches with an open (cut-out) light -->
    <path fill-rule="evenodd" d="
      M4 68 L4 38 C4 31 9 28.5 15 24.5 C21 28.5 26 31 26 38 L26 68 Z
      M8.5 68 L8.5 38.4 C8.5 33.6 11.4 31.6 15 28.6 C18.6 31.6 21.5 33.6 21.5 38.4 L21.5 68 Z"/>

    <path fill-rule="evenodd" d="
      M34 68 L34 38 C34 31 39 28.5 45 24.5 C51 28.5 56 31 56 38 L56 68 Z
      M38.5 68 L38.5 38.4 C38.5 33.6 41.4 31.6 45 28.6 C48.6 31.6 51.5 33.6 51.5 38.4 L51.5 68 Z"/>

    <path fill-rule="evenodd" d="
      M64 68 L64 38 C64 31 69 28.5 75 24.5 C81 28.5 86 31 86 38 L86 68 Z
      M68.5 68 L68.5 38.4 C68.5 33.6 71.4 31.6 75 28.6 C78.6 31.6 81.5 33.6 81.5 38.4 L81.5 68 Z"/>

    <!-- half-windows at the seam -->
    <path fill-rule="evenodd" d="
      M-11 68 L-11 38 C-11 31 -6 28.5 0 24.5 C6 28.5 11 31 11 38 L11 68 Z
      M-6.5 68 L-6.5 38.4 C-6.5 33.6 -3.6 31.6 0 28.6 C3.6 31.6 6.5 33.6 6.5 38.4 L6.5 68 Z" opacity="0"/>

    <!-- plinth -->
    <rect x="-2" y="64" width="94" height="4"/>
  </g>
</svg>
