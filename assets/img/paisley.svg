<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 78" width="60" height="78" fill="none">
  <!-- Original buta / ambi (paisley) motif, block-print outline style -->
  <g stroke="#7A1F2B" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer body: teardrop with the point bent over to the left -->
    <path stroke-width="2.2" d="M30 73
      C 46 63 54 49 52 36
      C 50 24 48 17 43 12
      C 36 4 24 3 19 11
      C 24 15 29 20 29 28
      C 29 42 14 44 11 53
      C 8 62 18 70 30 73 Z"/>
    <!-- inner echo -->
    <path stroke-width="1.2" opacity=".55" d="M30 65
      C 41 57 46 47 44 37
      C 42 28 40 23 37 19
      C 36 26 37 33 35 39
      C 32 48 20 50 18 56
      C 16 61 22 63 30 65 Z"/>
  </g>
  <g fill="#7A1F2B" opacity=".8">
    <circle cx="31" cy="55" r="2.2"/>
    <circle cx="38" cy="47" r="1.5"/>
    <circle cx="25" cy="61" r="1.5"/>
  </g>
</svg>
