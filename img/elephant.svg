<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 104" width="150" height="104" fill="none">
  <!-- Original stylised elephant, drawn for prashantapproves. Trunk raised. -->
  <g fill="#7A1F2B">
    <!-- tail -->
    <path d="M20 48 C 11 53 8 64 13 71" stroke="#7A1F2B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="13" cy="73" r="3.4"/>

    <!-- legs -->
    <rect x="26" y="66" width="14" height="30" rx="6.5"/>
    <rect x="45" y="68" width="14" height="28" rx="6.5"/>
    <rect x="72" y="68" width="14" height="28" rx="6.5"/>
    <rect x="90" y="66" width="14" height="30" rx="6.5"/>

    <!-- body + head -->
    <ellipse cx="54" cy="52" rx="36" ry="25"/>
    <circle cx="96" cy="52" r="21"/>

    <!-- trunk, raised, tapering across three strokes -->
    <g stroke="#7A1F2B" stroke-linecap="round" fill="none">
      <path stroke-width="13"  d="M108 64 C 122 64 130 55 131 45"/>
      <path stroke-width="9"   d="M131 45 C 132 35 128 28 121 27"/>
      <path stroke-width="5.5" d="M121 27 C 116 26 114 30 117 33"/>
    </g>
  </g>

  <!-- tusk -->
  <path d="M105 68 C 113 71 118 76 120 81 C 114 79 108 76 103 75 Z"
        fill="#FAF4E8" stroke="#7A1F2B" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- jhool (blanket), scalloped hem -->
  <path d="M30 31 C 42 24 68 24 79 31 L 75 47
           c -3 5 -9 5 -12 0 c -3 5 -9 5 -12 0 c -3 5 -9 5 -12 0 c -3 5 -9 5 -12 0 Z"
        fill="#FAF4E8" stroke="#7A1F2B" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#7A1F2B">
    <circle cx="42" cy="33" r="2"/><circle cx="54" cy="31" r="2"/><circle cx="66" cy="33" r="2"/>
    <circle cx="48" cy="41" r="1.6"/><circle cx="60" cy="41" r="1.6"/>
  </g>

  <!-- ear -->
  <path d="M90 34 C 76 34 70 47 74 60 C 78 71 93 69 95 55 C 96.5 46 96 36 90 34 Z"
        fill="#FAF4E8" stroke="#7A1F2B" stroke-width="1.6"/>
  <path d="M84 41 C 80 45 79 52 81 58" stroke="#7A1F2B" stroke-width="1.1" fill="none"
        stroke-linecap="round" opacity=".5"/>

  <!-- eye -->
  <circle cx="108" cy="47" r="2.8" fill="#FAF4E8"/>

  <!-- feet bands -->
  <g stroke="#FAF4E8" stroke-width="2.4" stroke-linecap="round">
    <path d="M29 89 H 37"/><path d="M48 89 H 56"/><path d="M75 89 H 83"/><path d="M93 89 H 101"/>
  </g>
</svg>
