<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- A thali. Six katoris ringing the whole rim, rice in the middle.
       They ring the plate symmetrically on purpose — three or four clustered
       at the top read as a face. Line art only, so it sits behind text happily. -->
  <g stroke="#7A1F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="64" r="46"/>
    <circle cx="60" cy="64" r="40" stroke-width="1.2" stroke-dasharray="0 5" opacity=".7"/>

    <!-- katoris, evenly spaced at radius 28 -->
    <circle cx="88" cy="64" r="9"/>
    <circle cx="74" cy="88.2" r="9"/>
    <circle cx="46" cy="88.2" r="9"/>
    <circle cx="32" cy="64" r="9"/>
    <circle cx="46" cy="39.8" r="9"/>
    <circle cx="74" cy="39.8" r="9"/>

    <!-- rice, in the middle where it belongs -->
    <circle cx="60" cy="64" r="13" stroke-width="1.6"/>
    <path d="M51 68 C54 60 66 60 69 68 Z" stroke-width="1.5"/>
    <path d="M56 63.5 L56 60.5 M60 62.5 L60 59 M64 63.5 L64 60.5"
          stroke-width="1.3" opacity=".8"/>
  </g>
  <!-- a little steam, well clear of the rim -->
  <g stroke="#7A1F2B" stroke-width="1.6" stroke-linecap="round" opacity=".5">
    <path d="M52 15 C55 11 49 8 52 4"/>
    <path d="M68 15 C71 11 65 8 68 4"/>
  </g>
</svg>
