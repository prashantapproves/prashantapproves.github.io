<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- A jharokha window with a crescent moon behind it. Reads "night, somewhere
       to sleep" without needing a bed. Line art only, sits behind text happily. -->
  <g stroke="#7A1F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- the arch -->
    <path d="M30 106 L30 52 C30 34 43 22 60 22 C77 22 90 34 90 52 L90 106"/>
    <!-- inner arch, the reveal -->
    <path d="M38 106 L38 54 C38 39 48 30 60 30 C72 30 82 39 82 54 L82 106"
          stroke-width="1.3" opacity=".8"/>
    <!-- sill and base -->
    <path d="M24 106 L96 106"/>
    <path d="M27 112 L93 112" stroke-width="1.4" opacity=".7"/>
    <!-- mullion + transom, the window itself -->
    <path d="M60 44 L60 106" stroke-width="1.2" opacity=".65"/>
    <path d="M40 70 L80 70" stroke-width="1.2" opacity=".65"/>
    <!-- little scallop along the top of the reveal -->
    <path d="M44 52 C48 46 52 46 56 52 M64 52 C68 46 72 46 76 52"
          stroke-width="1.2" opacity=".7"/>
    <!-- chhatri finial on the crown -->
    <path d="M60 22 L60 14" stroke-width="1.6"/>
    <circle cx="60" cy="11" r="3" stroke-width="1.6"/>
  </g>
  <!-- crescent moon, off to the side -->
  <g stroke="#7A1F2B" stroke-width="1.8" stroke-linecap="round" opacity=".7">
    <path d="M100 30 A11 11 0 1 0 100 52 A9 9 0 1 1 100 30 Z"/>
  </g>
  <g fill="#7A1F2B" opacity=".45">
    <circle cx="20" cy="34" r="1.7"/>
    <circle cx="28" cy="20" r="1.2"/>
    <circle cx="104" cy="66" r="1.2"/>
  </g>
</svg>
